name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kotoba (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | tail -n 5

      - name: Static checks
        run: python3 Tools/lint_swift.py

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Kotoba.xcodeproj \
            -scheme Kotoba \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee build.log | tail -n 80

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Verify bundle
        run: |
          APP="build/Build/Products/Debug-iphonesimulator/Kotoba.app"
          test -d "$APP"
          echo "Bundle contents:"
          ls -1 "$APP"
          test -f "$APP/Kotoba"
          test -f "$APP/Dictionary.json"
          test -f "$APP/SampleClips.json"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
